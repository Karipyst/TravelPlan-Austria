<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オーストリア旅行 行程表</title>
<style>
:root{--bg:#f3f5f4;--paper:#ffffff;--sage:#cfded8;--sage-deep:#2f7f93;--ink:#1f2328;--sub:#697177;--line:#dbe3e0;--dot:#c8ddd7;--shadow:0 14px 34px rgba(15,23,42,.08);--modal:rgba(11,18,24,.26)}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}a{text-decoration:none;color:inherit}button,input{font:inherit}body.locked{overflow:hidden}
#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:3000;background:linear-gradient(180deg,#e7efec 0%,#f3f5f4 100%)}
.auth-card{width:min(360px,calc(100vw - 32px));padding:28px 26px 22px;border-radius:28px;background:rgba(255,255,255,.78);backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(17,24,39,.12), inset 0 1px 0 rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.85)}
.auth-card h1{margin:0 0 8px;font-size:30px;letter-spacing:.04em;color:var(--sage-deep)}.auth-card p{margin:0 0 18px;color:var(--sub);font-size:14px;line-height:1.6}.auth-form{display:flex;flex-direction:column;gap:10px}.auth-input{height:48px;border:none;border-radius:16px;padding:0 16px;background:#fff;box-shadow:inset 0 0 0 1px rgba(60,60,67,.12);outline:none}.auth-input:focus{box-shadow:inset 0 0 0 2px rgba(47,127,147,.36)}.auth-btn{height:48px;border:none;border-radius:16px;cursor:pointer;background:var(--sage-deep);color:#fff;font-weight:700;letter-spacing:.04em}.auth-error{min-height:1.4em;margin-top:10px;font-size:12px;color:#d93025}.auth-note{margin-top:10px;color:var(--sub);font-size:12px}
#app{display:none}.wrapper{max-width:1120px;margin:0 auto;padding:18px}.loader-card,.empty{background:#fff;border:1px solid rgba(60,60,67,.10);border-radius:22px;box-shadow:var(--shadow)}.loader-card{display:none;padding:22px}.loader-card.show{display:block}.loader-title{margin:0 0 6px;font-size:20px}.loader-text{margin:0 0 12px;color:var(--sub);font-size:14px;line-height:1.6}.loader-actions{display:flex;gap:10px;flex-wrap:wrap}.loader-btn{height:42px;border:none;border-radius:14px;padding:0 14px;cursor:pointer;font-weight:700;background:var(--sage-deep);color:#fff}.loader-secondary{background:#edf4f2;color:var(--sage-deep)}.empty{padding:28px;text-align:center;color:var(--sub)}
.day-page{background:var(--paper);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px;border:1px solid rgba(60,60,67,.08);break-inside:avoid}.day-top{background:var(--sage);color:var(--sage-deep);padding:16px 20px 14px;border-bottom:1px solid rgba(255,255,255,.7)}.day-kicker{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:800;letter-spacing:.10em;text-transform:uppercase}.day-kicker .left{font-size:20px}.day-kicker .right{font-size:16px;white-space:nowrap}.day-date{margin-top:10px;text-align:right;font-size:18px;font-weight:800;letter-spacing:.08em}
.day-body{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(220px,.9fr);gap:0;min-height:600px}.timeline-side{padding:20px 18px 22px 18px}.memo-side{border-left:3px dotted var(--line);padding:18px 18px 22px;background:linear-gradient(180deg,#fcfcfb 0%, #f7faf8 100%)}.memo-title{font-size:15px;font-weight:800;letter-spacing:.10em;color:#c1d2cc;text-transform:uppercase;margin-bottom:18px}.memo-card{background:rgba(255,255,255,.72);border:1px solid rgba(60,60,67,.08);border-radius:18px;padding:14px 14px 12px;margin-bottom:12px}.memo-label{font-size:11px;color:var(--sub);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}.memo-value{font-size:14px;line-height:1.65;color:var(--ink)}.memo-bullets{margin:8px 0 0;padding-left:18px}.memo-bullets li{margin:0 0 6px;line-height:1.55}.cost-chip-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.cost-chip{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;background:#eef4f2;color:var(--sage-deep);font-size:12px;font-weight:700}
.event{display:grid;grid-template-columns:minmax(92px,max-content) 56px minmax(0,1fr);gap:12px;align-items:start;position:relative;margin-bottom:12px}.time-col{padding-top:10px;text-align:right;font-size:16px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;line-height:1.2}.icon-col{position:relative;display:flex;justify-content:center;min-height:100%}.icon-stack{position:relative;width:56px;display:flex;flex-direction:column;align-items:center}.icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--sage-deep);margin-top:2px;flex:0 0 auto}.icon svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.connector{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0 0}.connector span{width:14px;height:14px;border-radius:999px;background:var(--dot);display:block}.event:last-child .connector{display:none}.card{position:relative;min-height:68px;padding:8px 42px 8px 0;cursor:pointer;min-width:0}.place{font-size:16px;font-weight:800;line-height:1.35;letter-spacing:-.02em;margin:0 0 4px}.desc{font-size:14px;line-height:1.55;margin:0;color:var(--ink)}.subline{margin-top:5px;font-size:12px;color:var(--sub);line-height:1.5}.meta{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:8px}.meta-item{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;background:#f3f6f5;border:1px solid rgba(60,60,67,.07);font-size:11px;color:#586168}.map-link{position:absolute;top:8px;right:0;width:26px;height:26px;border-radius:999px;background:#edf4f2;border:1px solid rgba(47,127,147,.16);display:flex;align-items:center;justify-content:center;color:var(--sage-deep)}.map-link svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.event:hover .place{color:var(--sage-deep)}
@media (max-width:900px){.day-body{grid-template-columns:1fr}.memo-side{border-left:none;border-top:3px dotted var(--line)}}@media (max-width:680px){.wrapper{padding:10px}.day-top{padding:14px 14px 12px}.day-kicker .left{font-size:17px}.day-kicker .right{font-size:14px}.day-date{font-size:16px}.timeline-side{padding:16px 12px 18px 10px}.memo-side{padding:14px 12px 16px}.event{grid-template-columns:minmax(108px,max-content) 40px minmax(0,1fr);gap:10px}.time-col{font-size:14px;padding-top:7px}.icon-stack{width:40px}.icon{width:30px;height:30px}.icon svg{width:24px;height:24px}.connector{gap:5px;padding-top:6px}.connector span{width:11px;height:11px}.card{padding-top:6px;padding-right:38px}.place{font-size:15px}.desc{font-size:13px}}
@media print{body{background:#fff}.wrapper{max-width:none;padding:0}#auth,.loader-card,.modal-overlay{display:none !important}.day-page{margin:0;box-shadow:none;border:none;border-radius:0;page-break-after:always;break-after:page}.day-body{min-height:0}}@page{size:A4 portrait;margin:10mm}
.modal-overlay{position:fixed;inset:0;background:var(--modal);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:2500;padding:18px}.modal-overlay.show{display:flex}.modal{width:min(760px,100%);max-height:min(84vh,760px);overflow:auto;background:rgba(255,255,255,.93);border:1px solid rgba(255,255,255,.88);border-radius:24px;box-shadow:0 28px 80px rgba(0,0,0,.18);padding:18px;backdrop-filter:blur(24px)}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}.modal-kicker{font-size:10px;letter-spacing:.16em;color:var(--sub);text-transform:uppercase;margin-bottom:4px}.modal-title{margin:0 0 6px;font-size:28px;line-height:1.08;letter-spacing:-.04em}.modal-sub{margin:0;color:var(--sub);font-size:13px;line-height:1.5}.modal-close{width:38px;height:38px;border:none;border-radius:999px;background:#f1f3f4;cursor:pointer;font-size:22px}.modal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}.detail-card{background:#f7f9f8;border:1px solid rgba(60,60,67,.08);border-radius:16px;padding:12px 13px}.detail-wide{grid-column:1 / -1}.detail-label{font-size:11px;color:var(--sub);margin-bottom:5px}.detail-value{font-size:14px;line-height:1.6;word-break:break-word}.modal-actions{display:flex;gap:10px;flex-wrap:wrap}.action-btn{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 16px;border:none;border-radius:14px;cursor:pointer;font-weight:700}.action-primary{background:#111827;color:#fff}.action-secondary{background:#edf4f2;color:var(--sage-deep)}@media (max-width:680px){.modal-grid{grid-template-columns:1fr}.modal{padding:16px}.modal-title{font-size:24px}}@media (max-width:430px){.event{grid-template-columns:minmax(100px,max-content) 36px minmax(0,1fr);gap:8px}.time-col{font-size:13px}.icon-stack{width:36px}.icon{width:28px;height:28px}.icon svg{width:22px;height:22px}.map-link{top:6px;width:24px;height:24px}}
</style>
</head>
<body class="locked">
<section id="auth" aria-label="ログイン画面"><div class="auth-card"><h1>AUSTRIA TRIP</h1><p>CSVを読み込んで表示する行程表です。パスワードを入力すると、タイムライン形式で表示されます。</p><form id="authForm" class="auth-form"><input id="passwordInput" class="auth-input" type="password" placeholder="パスワード" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"><button id="loginButton" class="auth-btn" type="submit">ログイン</button></form><div id="authError" class="auth-error" aria-live="polite"></div><div class="auth-note">Enterキーでもログインできます</div></div></section>
<div id="app"><div class="wrapper"><section id="csvLoader" class="loader-card" aria-live="polite"><h2 class="loader-title">CSVを読み込めませんでした</h2><p class="loader-text">既定CSVの取得に失敗しました。ローカルで開いている場合は、CSVを選択するとそのまま表示できます。</p><div class="loader-actions"><button id="pickCsvButton" class="loader-btn" type="button">CSVを選択</button><button id="retryCsvButton" class="loader-btn loader-secondary" type="button">再読み込み</button></div><input id="csvFileInput" type="file" accept=".csv,text/csv" hidden></section><main id="daysRoot"></main></div></div>
<div id="detailOverlay" class="modal-overlay" aria-hidden="true"><article class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="modal-head"><div><div class="modal-kicker">detail</div><h2 id="detailTitle" class="modal-title">詳細</h2><p id="detailSub" class="modal-sub"></p></div><button id="detailClose" class="modal-close" type="button" aria-label="閉じる">×</button></div><div id="detailGrid" class="modal-grid"></div><div class="modal-actions"><a id="detailMapLink" class="action-btn action-primary" href="#" target="_blank" rel="noopener noreferrer">地図で開く</a><button id="detailCloseSecondary" class="action-btn action-secondary" type="button">閉じる</button></div></article></div>
<script>
const CSV_PATH='TravelPlan.csv'; const PW_PARTS=['b2tp','eW9y','dQ==']; const APP_TITLE='AUSTRIA TRIP'; const SECTION_LABEL='SCHEDULE'; let rows=[];
const authForm=document.getElementById('authForm'), passwordInput=document.getElementById('passwordInput'), authError=document.getElementById('authError'), auth=document.getElementById('auth'), app=document.getElementById('app'), daysRoot=document.getElementById('daysRoot'), csvLoader=document.getElementById('csvLoader'), csvFileInput=document.getElementById('csvFileInput');
authForm.addEventListener('submit',e=>{e.preventDefault();login();}); document.getElementById('loginButton').addEventListener('click',e=>{e.preventDefault();login();}); passwordInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();login();}});
document.getElementById('pickCsvButton').addEventListener('click',()=>csvFileInput.click()); document.getElementById('retryCsvButton').addEventListener('click',()=>loadCSV()); csvFileInput.addEventListener('change',async e=>{const f=e.target.files?.[0]; if(!f)return; const text=await f.text(); rows=normalizeRows(parseCSV(text)); render(); csvLoader.classList.remove('show');});
function login(){const expected=atob(PW_PARTS.join('')); if(passwordInput.value!==expected){authError.textContent='パスワードが違います'; return;} authError.textContent=''; auth.style.display='none'; app.style.display='block'; document.body.classList.remove('locked'); loadCSV();}
async function loadCSV(){try{const res=await fetch(CSV_PATH,{cache:'no-store'}); if(!res.ok) throw new Error('HTTP '+res.status); const text=await res.text(); rows=normalizeRows(parseCSV(text)); csvLoader.classList.remove('show'); render();}catch(err){rows=[]; render(); csvLoader.classList.add('show');}}
function parseCSV(text){const out=[]; let row=[], value='', inQuotes=false; for(let i=0;i<text.length;i++){const ch=text[i], next=text[i+1]; if(ch==='"'){ if(inQuotes && next==='"'){value+='"'; i++;} else inQuotes=!inQuotes; } else if(ch===',' && !inQuotes){ row.push(value); value=''; } else if((ch==='\n'||ch==='\r') && !inQuotes){ if(ch==='\r'&&next==='\n') i++; row.push(value); value=''; if(row.some(c=>c!=='')) out.push(row); row=[]; } else value+=ch;} if(value!==''||row.length){row.push(value); if(row.some(c=>c!=='')) out.push(row);} if(!out.length) return []; const headers=out[0].map(h=>String(h).trim()); return out.slice(1).map(cols=>{const obj={}; headers.forEach((h,idx)=>obj[h]=String(cols[idx]??'').trim()); return obj;}); }
function normalizeRows(items){return items.map((r,idx)=>({id:idx,date:r['日付']||'',start:r['開始時間']||'',end:r['終了時間']||'',place:r['場所']||'',content:r['内容']||'',summary:r['概要']||'',kind:r['種別']||'',transport:r['移動手段']||'',moveCost:r['移動費']||'',fee:r['利用料']||'',note:r['備考']||'',icon:r['アイコン']||'',lat:toNumber(r['緯度']),lng:toNumber(r['経度'])}));}
function toNumber(v){const n=Number(v); return Number.isFinite(n)?n:null;}
function render(){ if(!rows.length){daysRoot.innerHTML='<section class="empty">CSVを読み込むと、ここに日ごとの行程が表示されます。</section>'; return;} const groups=groupByDate(rows); daysRoot.innerHTML=groups.map((g,idx)=>renderDay(g,idx)).join(''); daysRoot.querySelectorAll('.card[data-id]').forEach(card=>card.addEventListener('click',()=>openDetail(Number(card.dataset.id)))); }
function groupByDate(items){const map=new Map(); items.forEach(item=>{if(!map.has(item.date)) map.set(item.date,[]); map.get(item.date).push(item);}); return [...map.entries()].map(([date,list])=>({date,items:list}));}
function renderDay(group,idx){const date=new Date(group.date+'T00:00:00'); const title=getDayTitle(group,idx); const memo=buildDailyMemo(group); return `<section class="day-page"><header class="day-top"><div class="day-kicker"><span class="left">${SECTION_LABEL}</span><span class="right">${APP_TITLE} DAY${idx+1}</span></div><div class="day-date">${escapeHTML(formatDateJP(date,group.date))}</div></header><div class="day-body"><div class="timeline-side">${group.items.map((item,itemIdx)=>renderEvent(item,itemIdx===group.items.length-1)).join('')}</div><aside class="memo-side"><div class="memo-title">MEMO</div><div class="memo-card"><div class="memo-label">今日の概要</div><div class="memo-value">${escapeHTML(title)}</div></div><div class="memo-card"><div class="memo-label">プランメモ</div><div class="memo-value">${escapeHTML(memo.summary)}</div>${memo.notes.length?`<ul class="memo-bullets">${memo.notes.map(n=>`<li>${escapeHTML(n)}</li>`).join('')}</ul>`:''}</div><div class="memo-card"><div class="memo-label">費用メモ</div><div class="memo-value">移動費・利用料は各タイルをタップすると詳細で確認できます。</div><div class="cost-chip-wrap">${memo.transportModes.map(v=>`<span class="cost-chip">${escapeHTML(v)}</span>`).join('')||'<span class="cost-chip">移動情報なし</span>'}</div></div></aside></div></section>`;}
function renderEvent(item,isLast){const meta=[]; if(item.kind) meta.push(`<span class="meta-item">${escapeHTML(item.kind)}</span>`); if(item.transport) meta.push(`<span class="meta-item">${escapeHTML(item.transport)}</span>`); if(item.moveCost&&item.moveCost!=='-') meta.push(`<span class="meta-item">移動費 ${escapeHTML(item.moveCost)}</span>`); if(item.fee&&item.fee!=='-') meta.push(`<span class="meta-item">利用料 ${escapeHTML(item.fee)}</span>`); return `<article class="event"><div class="time-col">${escapeHTML(formatTime(item.start,item.end))}</div><div class="icon-col"><div class="icon-stack"><div class="icon">${getIconSVG(item)}</div>${isLast?'':`<div class="connector"><span></span><span></span><span></span></div>`}</div></div><div class="card" data-id="${item.id}" tabindex="0" role="button" aria-label="${escapeAttr(item.place)} の詳細を開く">${item.lat!=null&&item.lng!=null?`<a class="map-link" href="${escapeAttr(buildMapUrl(item))}" target="_blank" rel="noopener noreferrer" aria-label="地図を開く" onclick="event.stopPropagation();">${mapIcon()}</a>`:''}<div class="place">${escapeHTML(item.place||'場所未設定')}</div><p class="desc">${escapeHTML(item.content||'内容未設定')}</p>${item.note?`<div class="subline">${escapeHTML(item.note)}</div>`:''}${meta.length?`<div class="meta">${meta.join('')}</div>`:''}</div></article>`;}
function getDayTitle(group,idx){const summary=group.items.find(v=>v.summary)?.summary||''; if(summary) return summary; const places=group.items.map(v=>v.place).filter(Boolean); return places.length?places.slice(0,3).join(' / '):`DAY ${idx+1}`;}
function buildDailyMemo(group){const summary=group.items.find(v=>v.summary)?.summary||'この日の行程をまとめています。'; const notes=[...new Set(group.items.map(v=>v.note).filter(Boolean))].slice(0,4); const transportModes=[...new Set(group.items.map(v=>v.transport).filter(Boolean))].slice(0,5); return {summary,notes,transportModes};}
function getIconSVG(item){const explicit=normalizeIconKey(item.icon); if(explicit) return iconFromKey(explicit); const text=`${item.kind} ${item.transport} ${item.content} ${item.place}`; if(/飛行機|空港|仁川|関西空港/.test(text)) return iconPlane(); if(/Railjet|列車|電車|地下鉄|CAT|S-?Bahn|駅|Regionalbus|トラム/.test(text)) return iconTrain(); if(/徒歩|散策|旧市街/.test(text)) return iconWalk(); if(/宿泊|ホテル/.test(text)) return iconHotel(); if(/食事|ランチ|ディナー|朝食|昼食|夕食|軽食|カフェ/.test(text)) return iconMeal(); if(/音楽|concert|opera|歌劇場|楽友協会|オペラ|バレエ/.test(text)) return iconMusic(); if(/大聖堂|教会|城|王宮|博物館|広場|観光/.test(text)) return iconLandmark(); return iconPin();}
function normalizeIconKey(value){const key=String(value||'').trim().toLowerCase(); if(!key) return ''; const aliases={plane:'plane','飛行機':'plane','airplane':'plane','flight':'plane',train:'train','電車':'train','列車':'train','rail':'train','railway':'train','bus':'train','walk':'walk','徒歩':'walk','散策':'walk','hotel':'hotel','宿泊':'hotel','meal':'meal','食事':'meal','food':'meal','music':'music','音楽':'music','concert':'music','landmark':'landmark','観光':'landmark','sightseeing':'landmark',pin:'pin','ピン':'pin','map':'pin'}; return aliases[key]||'';}
function iconFromKey(key){switch(key){case 'plane': return iconPlane(); case 'train': return iconTrain(); case 'walk': return iconWalk(); case 'hotel': return iconHotel(); case 'meal': return iconMeal(); case 'music': return iconMusic(); case 'landmark': return iconLandmark(); default: return iconPin();}}
function buildMapUrl(item){if(item.lat!=null&&item.lng!=null) return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.lat+','+item.lng)}`; return '#';}
const detailOverlay=document.getElementById('detailOverlay'), detailTitle=document.getElementById('detailTitle'), detailSub=document.getElementById('detailSub'), detailGrid=document.getElementById('detailGrid'), detailMapLink=document.getElementById('detailMapLink'); document.getElementById('detailClose').addEventListener('click',closeDetail); document.getElementById('detailCloseSecondary').addEventListener('click',closeDetail); detailOverlay.addEventListener('click',e=>{if(e.target===detailOverlay) closeDetail();}); document.addEventListener('keydown',e=>{if(e.key==='Escape') closeDetail();});
function openDetail(id){const item=rows.find(v=>v.id===id); if(!item) return; detailTitle.textContent=item.place||'詳細'; detailSub.textContent=[item.start&&formatTime(item.start,item.end), item.content].filter(Boolean).join('  /  '); detailGrid.innerHTML=[[ '内容', item.content||'未設定'],['種別', item.kind||'未設定'],['移動手段', item.transport||'未設定'],['移動費', item.moveCost||'未設定'],['利用料', item.fee||'未設定'],['日時', `${item.date||''} ${formatTime(item.start,item.end)}`.trim()||'未設定'],['その日の概要', item.summary||'未設定', true],['備考', item.note||'未設定', true]].map(([label,value,wide])=>`<section class="detail-card ${wide?'detail-wide':''}"><div class="detail-label">${escapeHTML(label)}</div><div class="detail-value">${escapeHTML(value)}</div></section>`).join(''); if(item.lat!=null&&item.lng!=null){detailMapLink.style.display='inline-flex'; detailMapLink.href=buildMapUrl(item);} else detailMapLink.style.display='none'; detailOverlay.classList.add('show'); detailOverlay.setAttribute('aria-hidden','false'); document.body.classList.add('locked');}
function closeDetail(){detailOverlay.classList.remove('show'); detailOverlay.setAttribute('aria-hidden','true'); if(app.style.display==='block') document.body.classList.remove('locked');}
function formatDateJP(dateObj,raw){if(!(dateObj instanceof Date)||Number.isNaN(dateObj.getTime())) return raw; const y=dateObj.getFullYear(), m=String(dateObj.getMonth()+1).padStart(2,'0'), d=String(dateObj.getDate()).padStart(2,'0'); return `${y}.${m}.${d}`;} function formatTime(start,end){if(start&&end) return `${start}–${end}`; return start||end||'時間未設定';} function escapeHTML(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');} function escapeAttr(v){return escapeHTML(v).replace(/`/g,'&#96;');}
